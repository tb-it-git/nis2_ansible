---
- name: Betriebssystemspezifische Variablen laden
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Systemweite Krypto-Policy (update-crypto-policies, RHEL)
  ansible.builtin.import_tasks: RedHat.yml
  when: ansible_os_family == "RedHat"

- name: Krypto-Vorgaben (crypto-config, OpenSSL/OpenSSH, Ubuntu)
  ansible.builtin.import_tasks: Debian.yml
  when: ansible_os_family == "Debian"

- name: NBDE-/LUKS-Tooling installieren
  ansible.builtin.package:
    name: "{{ encryption_nbde_packages }}"
    state: present
  when: encryption_install_nbde_tools | bool
