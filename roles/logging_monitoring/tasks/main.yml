---
# --- journald ---
- name: Journald-Drop-in-Verzeichnis sicherstellen
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Persistentes Journal-Verzeichnis anlegen
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"
  when: logging_monitoring_journald_storage == "persistent"

- name: Journald konfigurieren
  ansible.builtin.template:
    src: journald-nis2.conf.j2
    dest: /etc/systemd/journald.conf.d/90-nis2.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald

# --- auditd ---
- name: Audit-Paket installieren
  ansible.builtin.dnf:
    name: audit
    state: present

- name: Audit-Status ermitteln (Immutable-Erkennung)
  ansible.builtin.command: auditctl -s
  register: logging_monitoring_audit_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: STIG-Beispielregeln nach rules.d kopieren
  ansible.builtin.copy:
    src: "/usr/share/audit/sample-rules/{{ item }}"
    dest: "/etc/audit/rules.d/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0640"
  loop: "{{ logging_monitoring_auditd_sample_rules }}"
  notify:
    - Load audit rules
    - Audit-Reboot-Hinweis

- name: Immutable-Finalize-Regel ausbringen (Produktion)
  ansible.builtin.copy:
    content: |
      ## NIS2 (roles/logging_monitoring): Audit-Regelbestand sperren.
      ## Achtung: Aenderungen an den Regeln erfordern danach einen Reboot.
      -e 2
    dest: /etc/audit/rules.d/99-finalize.rules
    owner: root
    group: root
    mode: "0640"
  when: logging_monitoring_auditd_immutable | bool
  notify:
    - Load audit rules
    - Audit-Reboot-Hinweis

- name: Finalize-Regel entfernen, wenn Immutable deaktiviert
  ansible.builtin.file:
    path: /etc/audit/rules.d/99-finalize.rules
    state: absent
  when: not logging_monitoring_auditd_immutable | bool
  notify:
    - Load audit rules
    - Audit-Reboot-Hinweis

- name: Auditd aktivieren
  ansible.builtin.systemd_service:
    name: auditd
    enabled: true
    state: started

- name: Node-Exporter installieren und aktivieren (Upstream-Release)
  when: logging_monitoring_node_exporter_enabled | bool
  vars:
    logging_monitoring_ne_arch: "{{ logging_monitoring_node_exporter_arch_map[ansible_architecture] }}"
    logging_monitoring_ne_dir: "node_exporter-{{ logging_monitoring_node_exporter_version }}.linux-{{ logging_monitoring_ne_arch }}"
  block:
    - name: Systembenutzer node_exporter anlegen
      ansible.builtin.user:
        name: node_exporter
        system: true
        shell: /sbin/nologin
        create_home: false

    - name: Textfile-Collector-Verzeichnis anlegen
      ansible.builtin.file:
        path: "{{ logging_monitoring_node_exporter_textfile_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Release-Archiv laden (SHA256-verifiziert)
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ logging_monitoring_node_exporter_version }}/{{ logging_monitoring_ne_dir }}.tar.gz"
        dest: "/usr/local/src/{{ logging_monitoring_ne_dir }}.tar.gz"
        checksum: "{{ logging_monitoring_node_exporter_checksums[logging_monitoring_ne_arch] }}"
        mode: "0644"

    - name: Release-Archiv entpacken
      ansible.builtin.unarchive:
        src: "/usr/local/src/{{ logging_monitoring_ne_dir }}.tar.gz"
        dest: /usr/local/src
        remote_src: true
        creates: "/usr/local/src/{{ logging_monitoring_ne_dir }}/node_exporter"

    - name: Binary nach /usr/local/bin installieren
      ansible.builtin.copy:
        src: "/usr/local/src/{{ logging_monitoring_ne_dir }}/node_exporter"
        dest: /usr/local/bin/node_exporter
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: Restart node_exporter

    - name: Node-Exporter-Unit ausbringen
      ansible.builtin.template:
        src: node_exporter.service.j2
        dest: /etc/systemd/system/node_exporter.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart node_exporter

    - name: Node-Exporter aktivieren
      ansible.builtin.systemd_service:
        name: node_exporter
        enabled: true
        state: started
        daemon_reload: true

# --- zentrale Log-Weiterleitung (optional) ---
- name: Rsyslog-Weiterleitung konfigurieren
  ansible.builtin.template:
    src: rsyslog-forward.conf.j2
    dest: /etc/rsyslog.d/10-nis2-forward.conf
    owner: root
    group: root
    mode: "0644"
  when: logging_monitoring_rsyslog_forward_enabled | bool
  notify: Restart rsyslog
