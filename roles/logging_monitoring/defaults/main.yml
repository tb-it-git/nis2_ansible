---
# roles/logging_monitoring/defaults/main.yml
# Logging, Audit und Monitoring-Agent (RHEL 9/10). Ueberschreibbar.

# --- journald ---
logging_monitoring_journald_storage: "persistent"
logging_monitoring_journald_compress: true
logging_monitoring_journald_max_retention: "1month"
logging_monitoring_journald_forward_syslog: true

# --- auditd ---
logging_monitoring_auditd_sample_rules:
  - "10-base-config.rules"
  - "30-stig.rules"
  - "31-privileged.rules"
# Immutable (-e 2) ueber 99-finalize.rules: erfordert Reboot fuer spaetere Aenderungen.
# Standardmaessig aus, damit die Rolle wiederholbar bleibt; in Produktion aktivieren.
logging_monitoring_auditd_immutable: false

# --- node_exporter (Prometheus) ---
# Nicht in EPEL paketiert -> offizielles Upstream-Release, versionsgepinnt
# und per SHA256 verifiziert (Lieferkette, vgl. Kapitel 11).
logging_monitoring_node_exporter_enabled: true
logging_monitoring_node_exporter_version: "1.12.1"
logging_monitoring_node_exporter_arch_map:
  x86_64: "amd64"
  aarch64: "arm64"
logging_monitoring_node_exporter_checksums:
  amd64: "sha256:b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63"
  arm64: "sha256:ad35b605f9954b9f1ffddf5ba054bdc5a98d790b9eae5291e1eeb83f1ecbd0e7"
logging_monitoring_node_exporter_textfile_dir: "/var/lib/node_exporter/textfile_collector"

# --- zentrale Log-Weiterleitung (optional) ---
logging_monitoring_rsyslog_forward_enabled: false
logging_monitoring_rsyslog_target: "logcollector.example.com"
logging_monitoring_rsyslog_port: 514

