---
# Ubuntu-Gegenstueck zu dnf-automatic: unattended-upgrades, getrieben von den
# APT-Timern (apt-daily = Paketlisten/Download, apt-daily-upgrade = Installation).
- name: Patch-Werkzeuge installieren
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - needrestart        # Gegenstueck zu needs-restarting (dnf-utils)
    state: present

- name: Periodische APT-Laeufe konfigurieren
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Unattended-upgrades konfigurieren
  ansible.builtin.template:
    src: 52nis2-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52nis2-unattended-upgrades
    owner: root
    group: root
    mode: "0644"
    validate: "apt-config -c %s dump"

- name: APT-Timer aktivieren und starten
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
