---
- name: Betriebssystemspezifische Variablen laden
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Automatische Sicherheitsupdates (dnf-automatic, RHEL)
  ansible.builtin.import_tasks: RedHat.yml
  when: ansible_os_family == "RedHat"

- name: Automatische Sicherheitsupdates (unattended-upgrades, Ubuntu)
  ansible.builtin.import_tasks: Debian.yml
  when: ansible_os_family == "Debian"

- name: Woechentlichen OVAL-Schwachstellenscan einrichten
  ansible.builtin.import_tasks: scan.yml
  when: patch_management_oval_scan_enabled | bool
