---
# roles/backup/defaults/main.yml
# Ransomware-resistente Sicherung mit Restic (RHEL 9/10, Ubuntu 24.04/26.04). Ueberschreibbar.
# Hinweis: Geheimnisse (backup_password, backup_env) per Ansible Vault setzen.

backup_package: "restic"        # RHEL: aus EPEL, Ubuntu: aus universe

# EPEL bereitstellen (restic ist nicht in den RHEL-Basis-Repos; auf Ubuntu ohne Wirkung)
backup_install_epel: false

# Was wird gesichert
backup_paths:
  - /etc
  - /var/www
backup_excludes:
  - /var/cache
  - "*.tmp"
backup_tag: "scheduled"

# Repository und Zugang
backup_repository: "sftp:user@storagebox.example.com:/restic"
backup_password_file: "/etc/restic/password"
backup_password: ""             # wenn gesetzt (vaulted): wird in password_file geschrieben
backup_env: {}                  # zusaetzliche Env, z. B. AWS_ACCESS_KEY_ID/SECRET fuer S3/B2

# Aufbewahrung (forget/prune)
backup_prune_enabled: true      # bei Append-only-Repos auf false setzen (prune laeuft separat)
backup_keep_daily: 7
backup_keep_weekly: 4
backup_keep_monthly: 6
backup_keep_yearly: 3
backup_check_read_data_subset: "5G"

# Zeitplan
backup_oncalendar: "*-*-* 02:30:00"
backup_randomized_delay: 1800

# Erfolgsmetrik fuer node_exporter (Kapitel 7)
backup_metrics_enabled: true
backup_metrics_textfile: "/var/lib/node_exporter/textfile_collector/restic_backup.prom"
