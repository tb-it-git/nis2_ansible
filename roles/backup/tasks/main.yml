---
- name: EPEL-GPG-Schluessel importieren
  ansible.builtin.rpm_key:
    key: "https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-{{ ansible_distribution_major_version }}"
    state: present
  when:
    - ansible_os_family == "RedHat"
    - backup_install_epel | bool

- name: EPEL-Release installieren
  ansible.builtin.dnf:
    name: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_distribution_major_version }}.noarch.rpm"
    state: present
  when:
    - ansible_os_family == "RedHat"
    - backup_install_epel | bool

- name: Restic installieren
  ansible.builtin.package:
    name: "{{ backup_package }}"
    state: present

- name: Restic-Konfigurationsverzeichnis anlegen
  ansible.builtin.file:
    path: /etc/restic
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Repository-Passwort hinterlegen
  ansible.builtin.copy:
    content: "{{ backup_password }}\n"
    dest: "{{ backup_password_file }}"
    owner: root
    group: root
    mode: "0600"
  when: backup_password | length > 0
  no_log: true

- name: Restic-Umgebungsdatei ausbringen
  ansible.builtin.template:
    src: restic.env.j2
    dest: /etc/restic/restic.env
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Ausschlussliste ausbringen
  ansible.builtin.template:
    src: excludes.txt.j2
    dest: /etc/restic/excludes.txt
    owner: root
    group: root
    mode: "0644"

- name: Metrik-Verzeichnis sicherstellen
  ansible.builtin.file:
    path: "{{ backup_metrics_textfile | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: backup_metrics_enabled | bool

- name: Backup-Skript ausbringen
  ansible.builtin.template:
    src: nis2-backup.sh.j2
    dest: /usr/local/sbin/nis2-backup.sh
    owner: root
    group: root
    mode: "0750"

- name: Backup-Service ausbringen
  ansible.builtin.template:
    src: nis2-backup.service.j2
    dest: /etc/systemd/system/nis2-backup.service
    owner: root
    group: root
    mode: "0644"

- name: Backup-Timer ausbringen
  ansible.builtin.template:
    src: nis2-backup.timer.j2
    dest: /etc/systemd/system/nis2-backup.timer
    owner: root
    group: root
    mode: "0644"

- name: Backup-Timer aktivieren und starten
  ansible.builtin.systemd_service:
    name: nis2-backup.timer
    enabled: true
    state: started
    daemon_reload: true
