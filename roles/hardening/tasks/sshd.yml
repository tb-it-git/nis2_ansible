---
- name: SSH-Zugangsgruppe ermitteln (Aussperr-Schutz)
  ansible.builtin.getent:
    database: group
    key: "{{ hardening_ssh_allow_group }}"
  failed_when: false

- name: Abbrechen, wenn die SSH-Gruppe fehlt oder leer ist
  ansible.builtin.assert:
    that:
      - hardening_ssh_allow_group in (ansible_facts.getent_group | default({}))
      - (ansible_facts.getent_group[hardening_ssh_allow_group][2] | default('')) | length > 0
    fail_msg: >-
      Gruppe '{{ hardening_ssh_allow_group }}' existiert nicht oder hat keine
      Mitglieder — AllowGroups wuerde alle neuen SSH-Anmeldungen sperren.
      Gruppe anlegen, Admin-Benutzer aufnehmen und erneut ausfuehren.
    quiet: true

- name: SSH-Drop-in-Verzeichnis sicherstellen
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: SSH-Haertung als Drop-in ausbringen
  ansible.builtin.template:
    src: 50-nis2-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/50-nis2-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Reload sshd
