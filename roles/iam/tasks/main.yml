---
- name: Betriebssystemspezifische Variablen laden
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Zentrale Authentifizierung (SSSD/authselect, RHEL)
  ansible.builtin.import_tasks: RedHat.yml
  when: ansible_os_family == "RedHat"

- name: Zentrale Authentifizierung (SSSD/pam-auth-update, Ubuntu)
  ansible.builtin.import_tasks: Debian.yml
  when: ansible_os_family == "Debian"

- name: Kontosperre (faillock) konfigurieren
  ansible.builtin.template:
    src: faillock.conf.j2
    dest: /etc/security/faillock.conf
    owner: root
    group: root
    mode: "0644"

# Unter RHEL vorhanden, unter Ubuntu nicht (libpwquality liest es dennoch ein).
- name: Pwquality-Drop-in-Verzeichnis sicherstellen
  ansible.builtin.file:
    path: /etc/security/pwquality.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Passwortqualitaet (pwquality) konfigurieren
  ansible.builtin.template:
    src: pwquality-nis2.conf.j2
    dest: /etc/security/pwquality.conf.d/90-nis2.conf
    owner: root
    group: root
    mode: "0644"

- name: Sudo-Drop-in fuer Admin-Gruppe ausbringen
  ansible.builtin.template:
    src: 10-nis2-admins.j2
    dest: /etc/sudoers.d/10-nis2-admins
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
