---
- name: IAM-Pakete installieren
  ansible.builtin.dnf:
    name: "{{ iam_packages }}"
    state: present

- name: Oddjobd fuer mkhomedir aktivieren
  ansible.builtin.systemd_service:
    name: oddjobd
    enabled: true
    state: started
  when: "'with-mkhomedir' in iam_authselect_features"

- name: Aktuelles authselect-Profil ermitteln
  ansible.builtin.command: authselect current
  register: iam_authselect_current
  changed_when: false
  failed_when: false

- name: Authselect-Profil mit Features aktivieren
  ansible.builtin.command:
    argv: "{{ ['authselect', 'select', iam_authselect_profile] + iam_authselect_features + ['--force'] }}"
  register: iam_authselect_apply
  changed_when: iam_authselect_apply.rc == 0
  when: >-
    iam_authselect_profile not in iam_authselect_current.stdout
    or iam_authselect_features | reject('in', iam_authselect_current.stdout) | list | length > 0

- name: Kontosperre (faillock) konfigurieren
  ansible.builtin.template:
    src: faillock.conf.j2
    dest: /etc/security/faillock.conf
    owner: root
    group: root
    mode: "0644"

- name: Passwortqualitaet (pwquality) konfigurieren
  ansible.builtin.template:
    src: pwquality-nis2.conf.j2
    dest: /etc/security/pwquality.conf.d/90-nis2.conf
    owner: root
    group: root
    mode: "0644"

- name: Sudo-Drop-in fuer Admin-Gruppe ausbringen
  ansible.builtin.template:
    src: 10-nis2-admins.j2
    dest: /etc/sudoers.d/10-nis2-admins
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
